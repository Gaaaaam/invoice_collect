rules:
- id: rule_1779083931025_0.2893571278796888
  name: 火车票报销凭证归差旅费
  priority: 8
  conditions:
  - field: invoice_type
    match_type: contains
    value: 报销凭证
  - field: invoice_type
    match_type: contains
    value: 仅供报销使用
  - field: invoice_type
    match_type: contains
    value: 退票改签
  - field: items_description
    match_type: contains
    value: 报销凭证
  - field: items_description
    match_type: contains
    value: 仅供报销使用
  - field: items_description
    match_type: contains
    value: 退票改签
  - field: items_description
    match_type: regex
    value: 检票\s*[:：]
  condition_logic: OR
  target_category: travel
- id: rule_1779083931025_0.3974670402121734
  name: 物理火车票座位等级+站名归差旅费
  priority: 9
  conditions:
  - field: items_description
    match_type: regex
    value: (二等座|一等座|商务座|特等座|软卧|硬卧|软座|硬座)
  - field: invoice_type
    match_type: contains
    value: 火车票
  condition_logic: OR
  target_category: travel
- id: rule_1779083931025_0.12142992233359229
  name: 机票行程单归差旅费
  priority: 10
  conditions:
  - field: invoice_type
    match_type: contains
    value: 机票
  - field: invoice_type
    match_type: contains
    value: 行程单
  condition_logic: OR
  target_category: travel
- id: rule_1779083931025_0.14591161346337966
  name: 火车票归差旅费
  priority: 10
  conditions:
  - field: invoice_type
    match_type: contains
    value: 火车票
  - field: invoice_type
    match_type: contains
    value: 铁路
  - field: invoice_type
    match_type: contains
    value: 铁路电子客票
  - field: items_description
    match_type: contains
    value: 火车
  - field: items_description
    match_type: contains
    value: 高铁
  - field: items_description
    match_type: contains
    value: 动车
  - field: items_description
    match_type: regex
    value: '[GDCZTgdczt]\d{2,5}\s+.*[→\-—至到].*站'
  - field: items_description
    match_type: contains
    value: 电子客票号
  condition_logic: OR
  target_category: travel
- id: rule_1779083931025_0.8734400087656566
  name: 船票归差旅费
  priority: 10
  conditions:
  - field: invoice_type
    match_type: contains
    value: 船票
  - field: items_description
    match_type: contains
    value: 轮船
  condition_logic: OR
  target_category: travel
- id: rule_1779083931025_0.7113103882202716
  name: 住宿费归差旅费
  priority: 20
  conditions:
  - field: invoice_type
    match_type: contains
    value: 住宿
  - field: seller_name
    match_type: regex
    value: (酒店|宾馆|旅馆|民宿|客栈)
  - field: items_description
    match_type: regex
    value: (住宿|客房|房费)
  condition_logic: OR
  target_category: travel
- id: rule_1779083931025_0.8740840008446356
  name: 出租车/网约车归差旅费
  priority: 20
  conditions:
  - field: seller_name
    match_type: regex
    value: (出租|滴滴|曹操|嘀嗒|高德打车|神州专车)
  - field: invoice_type
    match_type: contains
    value: 出租车
  - field: items_description
    match_type: regex
    value: (客运服务费|运输服务\*?客运服务费|网约车|打车费|约车服务)
  condition_logic: OR
  target_category: travel
- id: rule_1779083931025_0.6219371014944072
  name: 会议场地费归会议费
  priority: 10
  conditions:
  - field: items_description
    match_type: regex
    value: (会议室|会务|会议服务|场地租用|会议场地)
  - field: seller_name
    match_type: regex
    value: (会展|会议中心|培训中心)
  condition_logic: OR
  target_category: meeting
- id: rule_1779083931025_0.10209475803659873
  name: 办公耗材归材料费
  priority: 20
  conditions:
  - field: items_description
    match_type: regex
    value: (办公用品|打印纸|墨盒|文具|耗材)
  - field: seller_name
    match_type: regex
    value: (办公|文具|耗材)
  condition_logic: OR
  target_category: material
- id: rule_1779083931025_0.2598295547781547
  name: 原材料归材料费
  priority: 20
  conditions:
  - field: items_description
    match_type: regex
    value: (原材料|材料|零件|配件|备件)
  condition_logic: OR
  target_category: material
- id: rule_1779083931025_0.19717299654158538
  name: 电子发票-代订机票归差旅费
  priority: 5
  conditions:
  - field: items_description
    match_type: regex
    value: (代订机票|代办机票|机票服务|购机票|订机票|代购机票|飞机票)
  - field: seller_name
    match_type: regex
    value: (携程|去哪儿|飞猪|同程|途牛|艺龙|华程|中青旅|中信旅|国旅|中旅|南湖国际|环球旅行)
  condition_logic: OR
  target_category: travel
- id: rule_1779083931025_0.7731426721309715
  name: 电子发票-代订火车票归差旅费
  priority: 5
  conditions:
  - field: items_description
    match_type: regex
    value: (代订火车票|代订高铁票|代订动车票|铁路客票|代购火车票|代购高铁)
  condition_logic: OR
  target_category: travel
- id: rule_1779083931025_0.10627489176437832
  name: 电子发票-代订住宿归差旅费
  priority: 5
  conditions:
  - field: items_description
    match_type: regex
    value: (代订酒店|代订客房|代订住宿|住宿服务|酒店服务|代订宾馆)
  condition_logic: OR
  target_category: travel
- id: rule_1779083931025_0.22615609567722605
  name: 电子发票-会议服务费归会议费
  priority: 5
  conditions:
  - field: items_description
    match_type: regex
    value: (会议服务|会务费|会务服务|会议室租赁|场地租赁|学术会议|研讨会|培训服务费)
  condition_logic: OR
  target_category: meeting
- id: rule_1779083931025_0.7697438403820858
  name: OTA平台代订交通归差旅费
  priority: 8
  conditions:
  - field: seller_name
    match_type: regex
    value: (携程|去哪儿|飞猪|同程旅行|途牛|艺龙|铁路|12306|华程西南|中青旅)
  - field: items_description
    match_type: regex
    value: (机票|火车票|高铁票|动车票|客票|代订|附加)
  condition_logic: OR
  target_category: travel
